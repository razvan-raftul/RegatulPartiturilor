name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    env:
      APPVER: 0.1.${{ github.run_number }}
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Componente
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cerinte.txt pyinstaller
      - name: Versiune
        shell: pwsh
        run: Set-Content -Path nucleu\_build.py -Value "VERSIUNE = '$env:APPVER'" -Encoding utf8
      - name: Proba nucleului
        run: python -c "from nucleu import partitura, cuvinte, braille, VERSIUNE; P=partitura.incarca('Exemple/Mozart - Sonata K545, expozitia.mxl'); print(VERSIUNE); print(P.descrie(1,2,[0,1],cuvinte.Optiuni())[:300].encode('ascii','replace').decode()); print(len(braille.din_scor(P.extrage(1,4,[0,1]))))"
      - name: Executabil
        run: >
          pyinstaller --noconfirm --windowed --name RegatulPartiturilor --icon icon.ico
          --add-data "icon.ico;."
          --collect-submodules music21 --collect-data music21 --collect-all pypdfium2 --collect-all pypdfium2_raw
          --exclude-module matplotlib --exclude-module tkinter --exclude-module scipy --exclude-module IPython --exclude-module pytest
          "Regatul Partiturilor.pyw"
      - name: Fără colecția de partituri din music21 (nu e folosită, ar mări mult programul)
        shell: pwsh
        run: |
          $c = "dist\RegatulPartiturilor\_internal\music21\corpus"
          if (Test-Path $c) { Get-ChildItem $c -Directory | Remove-Item -Recurse -Force }
          "{0:N0} MB" -f ((Get-ChildItem dist -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: NVDA Controller Client (NVDA spune progresul actualizării)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            Invoke-WebRequest "https://download.nvaccess.org/releases/2024.4/nvda_2024.4_controllerClient.zip" -OutFile nvdacc.zip
            Expand-Archive nvdacc.zip -DestinationPath nvdacc -Force
            $toate = Get-ChildItem nvdacc -Recurse -Filter 'nvdaControllerClient*.dll'
            $toate | ForEach-Object { Write-Host $_.FullName }
            $x64 = $toate | Where-Object { $_.FullName -match '\\x64\\' -or $_.Name -match '64\.dll$' } | Select-Object -First 1
            $x86 = $toate | Where-Object { $_.FullName -match '\\x86\\' -or $_.Name -match '32\.dll$' } | Select-Object -First 1
            if ($x64) { Copy-Item $x64.FullName dist\RegatulPartiturilor\nvdaControllerClient.dll; Copy-Item $x64.FullName nvdaControllerClient.dll; Write-Host "x64: $($x64.FullName)" }
            if ($x86) { Copy-Item $x86.FullName nvdaControllerClient32.dll; Write-Host "x86: $($x86.FullName)" }
          } catch { Write-Host "Fara NVDA Controller Client: $_" }
          exit 0
      - name: Executabil de proba (cu consola, ca sa se vada erorile)
        run: >
          pyinstaller --noconfirm --console --name RPTest --distpath testdist --workpath testbuild
          --add-data "icon.ico;."
          --collect-submodules music21 --collect-data music21 --collect-all pypdfium2 --collect-all pypdfium2_raw
          --exclude-module matplotlib --exclude-module tkinter --exclude-module scipy --exclude-module IPython --exclude-module pytest
          "Regatul Partiturilor.pyw"
      - name: Proba executabilului
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path nvdaControllerClient.dll) { Copy-Item nvdaControllerClient.dll testdist\RPTest\ }
          $p = Start-Process "testdist\RPTest\RPTest.exe" -ArgumentList '--autotest', '"Exemple\Mozart - Sonata K545, expozitia.mxl"', 'autotest.txt' -RedirectStandardOutput out.txt -RedirectStandardError err.txt -PassThru
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; Add-Content err.txt "TIMEOUT: programul nu s-a terminat in 4 minute" }
          $t = ''; if (Test-Path autotest.txt) { $t = Get-Content autotest.txt -Raw -Encoding utf8 }
          $d = "AUTOTEST:`n$t`n`nSTDOUT:`n" + (Get-Content out.txt -Raw) + "`n`nSTDERR:`n" + (Get-Content err.txt -Raw)
          Set-Content diagnostic.txt $d -Encoding utf8
          Write-Host $d
          gh release delete diagnostic --yes --cleanup-tag 2>$null
          gh release create diagnostic diagnostic.txt --prerelease --title "Diagnostic $env:APPVER" --notes "Rezultatul probei automate"
          if ($t -notmatch 'AUTOTEST OK') { Write-Host "Proba programului a esuat"; exit 1 }
          # aceeasi proba si pe programul adevarat, fara consola
          $q = Start-Process "dist\RegatulPartiturilor\RegatulPartiturilor.exe" -ArgumentList '--autotest', '"Exemple\Mozart - Sonata K545, expozitia.mxl"', 'autotest2.txt' -PassThru
          if (-not $q.WaitForExit(240000)) { Stop-Process -Id $q.Id -Force; Write-Host "Programul fara consola nu s-a terminat"; exit 1 }
          if (-not (Test-Path autotest2.txt) -or ((Get-Content autotest2.txt -Raw -Encoding utf8) -notmatch 'AUTOTEST OK')) { Write-Host "Proba programului fara consola a esuat"; exit 1 }
          Write-Host "Ambele probe au trecut"
          exit 0
      - name: Program de instalare
        shell: pwsh
        run: |
          try { Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Romanian.isl" -OutFile Romanian.isl } catch { Write-Host "Fara traducere romana" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:APPVER" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Content -Path version.txt -Value $env:APPVER -NoNewline -Encoding ascii
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest RegatulPartiturilor-Setup.exe version.txt --title "Regatul Partiturilor $env:APPVER" --notes "Versiunea $env:APPVER. RegatulPartiturilor-Setup.exe instaleaza programul si pune scurtatura pe desktop; programul se actualizeaza singur la pornire."
