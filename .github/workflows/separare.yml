name: separare
# Pregătește programul de separare al pieselor (Demucs, cu modelele lui, și ffmpeg cu rubberband pentru tonalitate)
# și îl pune ca separare.zip în release-ul „separare”. Music Box îl descarcă singur prima dată când e folosit.
# Rulează când se schimbă separare.txt, separare_lansator.py sau acest fișier, ori la cerere.
on:
  push:
    branches: [main]
    paths: [separare.txt, separare_lansator.py, .github/workflows/separare.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  separare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Demucs și PyTorch (doar procesorul)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy<2" demucs==4.0.1 soundfile pyinstaller
          python -c "from demucs.pretrained import get_model; [get_model(n) for n in ('htdemucs', 'htdemucs_6s')]; print('modele OK')"
      - name: Împachetare
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pyinstaller --noconfirm --console --name separare --distpath C:\sd --workpath C:\sb --collect-all demucs --collect-submodules julius --collect-submodules openunmix --collect-submodules dora --exclude-module matplotlib --exclude-module tkinter separare_lansator.py
          $z = 'C:\z\Separare'
          New-Item -ItemType Directory -Force C:\z | Out-Null
          Move-Item C:\sd\separare $z
          New-Item -ItemType Directory -Force "$z\modele" | Out-Null
          $demucs = python -c "import demucs, os; print(os.path.dirname(demucs.__file__))"
          Copy-Item "$demucs\remote\htdemucs.yaml", "$demucs\remote\htdemucs_6s.yaml" "$z\modele\"
          $hub = python -c "import torch; print(torch.hub.get_dir())"
          Get-ChildItem "$hub\checkpoints" -Filter *.th | ForEach-Object { Copy-Item $_.FullName "$z\modele\" }
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile C:\ff.zip
          Expand-Archive C:\ff.zip C:\ff
          Copy-Item (Get-ChildItem C:\ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName "$z\"
          Copy-Item (Get-ChildItem C:\ff -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName "$z\ffmpeg-licenta.txt"
          Set-Content "$z\versiune.txt" ((Get-Content separare.txt | Where-Object { $_ -match '^\s*Separare\s*=' }) -replace '^\s*Separare\s*=\s*', '').Trim()
          Get-ChildItem $z\modele | ForEach-Object { "{0}: {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }
          "Separare: {0:N0} MB" -f ((Get-ChildItem $z -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: Probă (o piesă scurtă, despărțită și mutată cu 2 semitonuri)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $z = 'C:\z\Separare'
          New-Item -ItemType Directory -Force C:\t | Out-Null
          & "$z\ffmpeg.exe" -v error -y -f lavfi -i "sine=f=220:d=12" -f lavfi -i "anoisesrc=d=12:a=0.05" -filter_complex "amix=inputs=2,aformat=channel_layouts=stereo" C:\t\proba.mp3
          $d = @()
          $d += (& "$z\separare.exe" --verifica | Out-String)
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $d += (& "$z\separare.exe" --intrare C:\t\proba.mp3 --iesire C:\t\out --element voce Voce --element negativ Negativ --element pian Pian --semitonuri 2 2>&1 | Out-String)
          $d += "Timp: $([int]$sw.Elapsed.TotalSeconds) s"
          $d += (& "$z\separare.exe" --intrare C:\t\proba.mp3 --iesire C:\t\out --element original "Tonalitate -3" --semitonuri -3 --format wav 2>&1 | Out-String)
          $f = Get-ChildItem C:\t\out
          $d += "Fisiere: " + (($f | ForEach-Object { "$($_.Name) ($($_.Length))" }) -join ', ')
          if ($f.Count -eq 4) { $d += 'PROBA OK' }
          Set-Content C:\t\diagnostic-separare.txt ($d -join "`n") -Encoding utf8
          Write-Host ($d -join "`n")
      - name: Arhivă și publicare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Select-String -Path C:\t\diagnostic-separare.txt -Pattern 'PROBA OK' -Quiet)) {
            gh release delete separare-diagnostic --yes --cleanup-tag 2>$null
            gh release create separare-diagnostic C:\t\diagnostic-separare.txt --prerelease --title "Separare (proba nereusita)" --notes "Diagnostic"
            Write-Host "Proba nu a trecut; nu public arhiva"; exit 1
          }
          Compress-Archive -Path C:\z\Separare\* -DestinationPath C:\t\separare.zip -CompressionLevel Optimal
          "separare.zip: {0:N0} MB" -f ((Get-Item C:\t\separare.zip).Length / 1MB)
          gh release delete separare --yes --cleanup-tag 2>$null
          gh release create separare C:\t\separare.zip C:\t\diagnostic-separare.txt separare.txt --prerelease --title "Separare" --notes "Programul de separare a pieselor (Demucs) si de schimbare a tonalitatii, pentru Music Box."
